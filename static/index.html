<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoomMatch – Rooms, Roommates & Sublets</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1a2233;--muted:#5d6778;--line:#e1e5ec;
  --accent:#2563eb;--accent-text:#fff;--danger:#e11d48;--wa:#25d366;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10141c;--card:#1a2030;--text:#e8ecf4;--muted:#9aa5b8;
    --line:#2b3347;--accent:#5b8cff;--accent-text:#0b1020;--danger:#ff6b8a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0);
}
header{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:14px 20px;display:flex;justify-content:space-between;
  align-items:center;flex-wrap:wrap;gap:10px;
  position:sticky;top:0;z-index:10;
}
.logo{font-weight:800;font-size:20px}
.logo span{color:var(--accent)}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{
  font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--text);padding:8px 14px;transition:opacity .15s;
}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.ghost{border:0;background:none;color:var(--accent);padding:4px}
.hero{text-align:center;padding:36px 20px 20px;max-width:760px;margin:auto}
.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,38px)}
.hero p{color:var(--muted);margin:0}
.filters{
  max-width:960px;margin:16px auto;padding:0 16px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;
}
input,select,textarea{
  font:inherit;width:100%;padding:10px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.tabs{max-width:960px;margin:0 auto;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.tabs button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.grid{
  max-width:960px;margin:16px auto 40px;padding:0 16px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px;display:flex;flex-direction:column;gap:8px;
  scroll-margin-top:90px;transition:box-shadow .3s, border-color .3s;
}
.card.highlight{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent)}
.tag{
  align-self:flex-start;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;color:var(--accent);
}
.price{font-size:22px;font-weight:800}
.price small{font-weight:400;color:var(--muted);font-size:14px}
.card h3{margin:0;font-size:17px}
.meta{color:var(--muted);font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
dialog{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--text);width:min(460px,92vw);padding:20px;
}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:14px;margin:10px 0 4px;color:var(--muted)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;align-items:center}
#acct{font-size:14px;color:var(--muted)}
.hint{max-width:960px;margin:0 auto 8px;padding:0 16px;color:var(--muted);font-size:14px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 button{flex:1;min-width:0}
.row2 .wa-btn{flex:0 0 auto;background:var(--wa);color:#fff;border-color:var(--wa);font-weight:600}
.row2 .icon-btn{flex:0 0 auto;padding:6px 10px;font-size:16px;line-height:1}
.fav{font-size:18px;line-height:1;padding:6px 10px}
.fav.on{color:var(--danger);border-color:var(--danger)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 20px 90px}
#err{color:var(--danger);font-size:14px;margin:8px 0 0;min-height:20px}
.wa-float{
  position:fixed;bottom:20px;right:20px;z-index:1000;border-radius:50%;
  background:var(--wa);color:#fff;width:60px;height:60px;border:0;
  font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;
}
.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:#111827;color:#fff;padding:10px 16px;border-radius:8px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  z-index:2000;box-shadow:0 8px 20px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:480px){
  .header-actions{width:100%;justify-content:flex-end}
}
</style>
</head>
<body>
<header>
  <div class="logo">Room<span>Match</span></div>
  <div class="header-actions">
    <span id="acct"></span>
    <button id="postBtn" class="primary" hidden>Post a listing</button>
    <button id="registerBtn" hidden>Register</button>
    <button id="loginBtn" class="primary">Sign in</button>
    <button id="logoutBtn" hidden>Sign out</button>
  </div>
</header>

<section class="hero">
  <h1>Find a room, a roommate, or a sublet</h1>
  <p>Browse listings from people near you. Filter by city and budget, then reach out directly.</p>
</section>

<div class="tabs" id="tabs">
  <button data-t="all" class="on">All</button>
  <button data-t="Room">Rooms</button>
  <button data-t="Roommate">Roommates</button>
  <button data-t="Sublet">Sublets</button>
  <button data-t="saved">♥ Saved</button>
  <button data-t="mine">My listings</button>
</div>

<div class="filters">
  <input id="q" placeholder="Search city or keyword">
  <input id="max" type="number" min="0" placeholder="Max price / month">
  <select id="sort">
    <option value="new">Newest</option>
    <option value="lo">Price: low to high</option>
    <option value="hi">Price: high to low</option>
  </select>
</div>

<div class="hint" id="hint"></div>
<main class="grid" id="grid"></main>

<dialog id="postDlg">
  <h2 style="margin:0 0 4px">Post a listing</h2>
  <label>Type</label>
  <select id="fType">
    <option>Room</option>
    <option>Roommate</option>
    <option>Sublet</option>
  </select>
  <label>Title</label>
  <input id="fTitle" placeholder="Sunny room near campus">
  <label>City / area</label>
  <input id="fCity" placeholder="Austin, TX">
  <label>Monthly price</label>
  <input id="fPrice" type="number" min="0">
  <label>Details</label>
  <textarea id="fDesc" rows="3" placeholder="Move-in date, amenities, house rules…"></textarea>
  <label>Contact (email or phone)</label>
  <input id="fContact">
  <p id="err" role="alert"></p>
  <div class="row">
    <button id="cancel">Cancel</button>
    <button class="primary" id="save">Publish</button>
  </div>
</dialog>

<dialog id="authDlg">
  <h2 id="aTitle" style="margin:0 0 4px">Sign in</h2>
  <div id="nameWrap" hidden>
    <label>Name</label>
    <input id="aName" autocomplete="name">
  </div>
  <label>Email</label>
  <input id="aEmail" type="email" autocomplete="email">
  <label>Password</label>
  <input id="aPw" type="password" autocomplete="current-password" placeholder="At least 8 characters">
  <p id="aErr" role="alert"></p>
  <div class="row" style="justify-content:space-between">
    <button id="aSwitch" type="button" class="ghost">Create an account</button>
    <span style="display:flex;gap:8px">
      <button id="aCancel" type="button">Cancel</button>
      <button class="primary" id="aGo" type="button">Sign in</button>
    </span>
  </div>
</dialog>

<dialog id="contactDlg">
  <h2 id="cTitle" style="margin:0 0 8px"></h2>
  <p id="cBody" class="meta"></p>
  <div class="row">
    <button id="cCopy" type="button" class="icon-btn">🔗 Copy link</button>
    <button id="cShare" type="button" class="icon-btn">📤 Share</button>
    <button id="cWa" style="background:var(--wa);color:#fff;border-color:var(--wa)">WhatsApp</button>
    <button id="cClose">Close</button>
  </div>
</dialog>

<footer>Meet in public places first and never send money before seeing a place in person.</footer>

<button id="waFloat" class="wa-float" title="Chat with RoomMatch on WhatsApp" aria-label="Chat on WhatsApp">💬</button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const BUSINESS_WA = "14155238886";
const state = { tab: "all", me: null, listings: [], reg: false, lastContact: null };
const $ = (id) => document.getElementById(id);
const esc = (s) =>
  String(s).replace(/[&<>"]/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
  }[c]));

/* ---------- Toast helper ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

/* ---------- Share helpers ---------- */
function listingUrl(id) {
  return `${location.origin}${location.pathname}#listing-${id}`;
}

function listingShareText(l) {
  return (
    `${l.title} — ${l.city} · $${Number(l.price).toLocaleString()}/mo ` +
    `(${l.type})\n${listingUrl(l.id)}`
  );
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  // Fallback for non-secure contexts / older browsers
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

async function copyListingLink(l) {
  const url = listingUrl(l.id);
  const ok = await copyText(url);
  if (ok) toast("Link copied: " + url);
  else toast("Copy failed — long-press the URL");
  return ok;
}

async function shareListing(l) {
  const url = listingUrl(l.id);
  const data = {
    title: `${l.title} — RoomMatch`,
    text: `${l.title} in ${l.city} · $${Number(l.price).toLocaleString()}/mo`,
    url,
  };
  if (navigator.share) {
    try {
      await navigator.share(data);
      return;
    } catch (e) {
      if (e.name === "AbortError") return; // user cancelled
    }
  }
  // Fallback
  const ok = await copyText(`${data.text}\n${url}`);
  toast(ok ? "Link copied to clipboard" : "Unable to share");
}

/* ---------- API ---------- */
async function api(path, method = "GET", body) {
  const opts = { method, credentials: "same-origin" };
  if (body !== undefined) {
    opts.headers = { "Content-Type": "application/json" };
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Something went wrong");
  return data;
}

/* ---------- Render ---------- */
function updateHeader() {
  const loggedIn = !!state.me;
  $("acct").textContent = loggedIn ? "Hi, " + state.me.name : "";
  $("postBtn").hidden = !loggedIn;
  $("registerBtn").hidden = loggedIn;
  $("loginBtn").hidden = loggedIn;
  $("logoutBtn").hidden = !loggedIn;
  $("hint").textContent = loggedIn
    ? ""
    : "Sign in or register to post listings and save favorites.";
}

function render() {
  updateHeader();
  const q = $("q").value.trim().toLowerCase();
  const max = parseFloat($("max").value);
  const sort = $("sort").value;

  let rows = state.listings.filter((l) => {
    if (state.tab === "saved" && !l.saved) return false;
    if (state.tab === "mine" && !l.mine) return false;
    if (state.tab !== "all" && state.tab !== "saved" && state.tab !== "mine"
        && l.type !== state.tab) return false;
    if (q) {
      const hay = (l.city + " " + l.title + " " + l.desc).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (!isNaN(max) && l.price > max) return false;
    return true;
  });

  if (sort === "lo") rows.sort((a, b) => a.price - b.price);
  else if (sort === "hi") rows.sort((a, b) => b.price - a.price);

  $("grid").innerHTML = rows.length
    ? rows.map((l) => `
      <article class="card" id="listing-${l.id}" data-lid="${l.id}">
        <span class="tag">${esc(l.type)}</span>
        <h3>${esc(l.title)}</h3>
        <div class="price">$${Number(l.price).toLocaleString()} <small>/ month</small></div>
        <div class="meta">${esc(l.city)} · by ${esc(l.owner_name)}</div>
        <p style="margin:0">${esc(l.desc)}</p>
        <div class="row2">
          <button class="primary" data-c="${l.id}">Contact</button>
          <button class="wa-btn" data-wa="${l.id}" title="Message on WhatsApp">💬</button>
          <button class="icon-btn" data-copy="${l.id}" title="Copy link">🔗</button>
          <button class="icon-btn" data-share="${l.id}" title="Share">📤</button>
          ${state.me ? `<button class="fav ${l.saved ? "on" : ""}" data-f="${l.id}" title="Save">♥</button>` : ""}
          ${l.mine ? `<button data-d="${l.id}">Delete</button>` : ""}
        </div>
      </article>
    `).join("")
    : '<div class="empty">No listings here yet.</div>';

  // If URL already has a #listing-<id>, focus it after re-render
  focusFromHash({ smooth: false });
}

/* ---------- Deep-link focus ---------- */
function focusFromHash({ smooth = true } = {}) {
  const m = location.hash.match(/^#listing-(\d+)$/);
  if (!m) return;
  const el = document.getElementById("listing-" + m[1]);
  if (!el) return;
  el.classList.add("highlight");
  el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "center" });
  setTimeout(() => el.classList.remove("highlight"), 2500);
}

window.addEventListener("hashchange", () => focusFromHash());

/* ---------- Load ---------- */
async function load() {
  try {
    const data = await api("/api/listings");
    state.listings = data.listings || [];
  } catch (e) {
    state.listings = [];
  }
  render();
}

async function loadMe() {
  try {
    const data = await api("/api/me");
    state.me = data.user || null;
  } catch (e) {
    state.me = null;
  }
}

/* ---------- Auth ---------- */
function openAuth(register) {
  state.reg = register;
  $("aTitle").textContent = register ? "Create account" : "Sign in";
  $("aGo").textContent = register ? "Sign up" : "Sign in";
  $("aSwitch").textContent = register ? "I have an account" : "Create an account";
  $("nameWrap").hidden = !register;
  $("aErr").textContent = "";
  $("aPw").value = "";
  $("aPw").autocomplete = register ? "new-password" : "current-password";
  $("authDlg").showModal();
  setTimeout(() => (register ? $("aName") : $("aEmail")).focus(), 30);
}

async function submitAuth() {
  const body = { email: $("aEmail").value.trim(), password: $("aPw").value };
  if (state.reg) body.name = $("aName").value.trim();
  try {
    const data = await api(state.reg ? "/api/register" : "/api/login", "POST", body);
    state.me = data.user;
    $("authDlg").close();
    $("aPw").value = "";
    $("aErr").textContent = "";
    await load();
  } catch (e) {
    $("aErr").textContent = e.message;
  }
}

/* ---------- Post ---------- */
function openPost() {
  if (!state.me) { openAuth(false); return; }
  $("err").textContent = "";
  $("postDlg").showModal();
  setTimeout(() => $("fTitle").focus(), 30);
}

async function submitPost() {
  const body = {
    type: $("fType").value,
    title: $("fTitle").value.trim(),
    city: $("fCity").value.trim(),
    price: $("fPrice").value,
    desc: $("fDesc").value.trim(),
    contact: $("fContact").value.trim(),
  };
  if (!body.title || !body.city || !body.contact || body.price === "") {
    $("err").textContent = "Please fill in title, city, price and contact.";
    return;
  }
  try {
    await api("/api/listings", "POST", body);
    ["fTitle", "fCity", "fPrice", "fDesc", "fContact"].forEach((i) => ($(i).value = ""));
    $("err").textContent = "";
    $("postDlg").close();
    await load();
  } catch (e) {
    $("err").textContent = e.message;
  }
}

/* ---------- Contact dialog ---------- */
function openContact(listing) {
  state.lastContact = listing;
  $("cTitle").textContent = listing.title;
  $("cBody").textContent = "Contact: " + listing.contact;
  $("cWa").onclick = () => {
    const msg =
      `Hello! I'm interested in your listing: ${listing.title} ` +
      `in ${listing.city} ($${listing.price}/month). Contact: ${listing.contact}\n` +
      listingUrl(listing.id);
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
  };
  $("cCopy").onclick = () => copyListingLink(listing);
  $("cShare").onclick = () => shareListing(listing);
  $("contactDlg").showModal();
}

/* ---------- Wiring ---------- */
$("loginBtn").onclick = () => openAuth(false);
$("registerBtn").onclick = () => openAuth(true);
$("postBtn").onclick = openPost;
$("logoutBtn").onclick = async () => {
  try { await api("/api/logout", "POST", {}); } catch (e) {}
  state.me = null;
  if (state.tab === "saved" || state.tab === "mine") {
    state.tab = "all";
    document.querySelectorAll("#tabs button").forEach((b) =>
      b.classList.toggle("on", b.dataset.t === "all")
    );
  }
  await load();
};

$("aSwitch").onclick = () => openAuth(!state.reg);
$("aCancel").onclick = () => $("authDlg").close();
$("aGo").onclick = submitAuth;
$("authDlg").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); submitAuth(); }
});

$("cancel").onclick = () => $("postDlg").close();
$("save").onclick = submitPost;
$("postDlg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
    e.preventDefault(); submitPost();
  }
});

$("cClose").onclick = () => $("contactDlg").close();

$("tabs").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const t = b.dataset.t;
  if ((t === "saved" || t === "mine") && !state.me) { openAuth(false); return; }
  state.tab = t;
  document.querySelectorAll("#tabs button").forEach((x) =>
    x.classList.toggle("on", x === b)
  );
  render();
};

["q", "max", "sort"].forEach((id) => {
  $(id).addEventListener("input", render);
  $(id).addEventListener("change", render);
});

/* Event delegation for card actions */
$("grid").addEventListener("click", async (e) => {
  const contactBtn = e.target.closest("[data-c]");
  const favBtn = e.target.closest("[data-f]");
  const delBtn = e.target.closest("[data-d]");
  const waBtn = e.target.closest("[data-wa]");
  const copyBtn = e.target.closest("[data-copy]");
  const shareBtn = e.target.closest("[data-share]");

  try {
    if (contactBtn) {
      const l = state.listings.find((x) => x.id == contactBtn.dataset.c);
      if (l) openContact(l);
    } else if (favBtn) {
      if (!state.me) { openAuth(false); return; }
      const l = state.listings.find((x) => x.id == favBtn.dataset.f);
      if (!l) return;
      await api("/api/favorites/" + l.id, l.saved ? "DELETE" : "PUT");
      l.saved = l.saved ? 0 : 1;
      render();
    } else if (delBtn) {
      if (!confirm("Delete this listing?")) return;
      await api("/api/listings/" + delBtn.dataset.d, "DELETE");
      await load();
    } else if (waBtn) {
      const l = state.listings.find((x) => x.id == waBtn.dataset.wa);
      if (!l) return;
      const msg =
        `Hello! I'm interested in your listing: ${l.title} ` +
        `in ${l.city} ($${l.price}/month). Contact: ${l.contact}\n` +
        listingUrl(l.id);
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
    } else if (copyBtn) {
      const l = state.listings.find((x) => x.id == copyBtn.dataset.copy);
      if (l) copyListingLink(l);
    } else if (shareBtn) {
      const l = state.listings.find((x) => x.id == shareBtn.dataset.share);
      if (l) shareListing(l);
    }
  } catch (err) {
    alert(err.message);
  }
});

$("waFloat").addEventListener("click", () => {
  const msg = encodeURIComponent("Hello RoomMatch! I need help finding a place.");
  window.open(`https://wa.me/${BUSINESS_WA}?text=${msg}`, "_blank");
});

/* Boot */
(async () => {
  await loadMe();
  await load();
  focusFromHash({ smooth: true });
})();
</script>
</body>
</html>
